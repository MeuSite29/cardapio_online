<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artcake_cruz — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#FFF6ED;
    --creme-2:#FFFDF9;
    --framboesa:#D6336C;
    --framboesa-escura:#A82256;
    --pessego:#FF9776;
    --pistache:#7FB69A;
    --pistache-clara:#DCEEE3;
    --manteiga:#F4B942;
    --chocolate:#3B2A2A;
    --chocolate-suave:#6B5555;
    --branco:#ffffff;
    --erro:#D6336C;
    --sombra: 0 10px 30px -12px rgba(59,42,42,0.18);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ overflow-x:hidden; }
  body{
    min-height:100vh;
    background:var(--creme);
    color:var(--chocolate);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1, h2, .display{ font-family:'Fraunces', serif; letter-spacing:-0.01em; }

  .brandname{ font-family:'Baloo 2', sans-serif; font-weight:700; }
  .brandname .script{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    color:var(--framboesa-escura);
    margin-left:1px;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- Tela de login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--branco);
    border-radius:24px;
    padding:32px 28px;
    box-shadow:var(--sombra);
    text-align:center;
  }
  .login-card h1{ font-size:1.4rem; margin-bottom:6px; }
  .login-card p{ font-size:0.85rem; color:var(--chocolate-suave); margin-bottom:20px; }

  form{ display:flex; flex-direction:column; gap:12px; text-align:left; }
  label{ font-size:0.8rem; font-weight:700; color:var(--chocolate-suave); }
  input{
    width:100%;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:0.94rem;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid rgba(59,42,42,0.14);
    background:var(--creme-2);
    color:var(--chocolate);
  }
  input:focus{ outline:none; border-color:var(--framboesa); }

  .btn{
    width:100%;
    margin-top:6px;
    border:none;
    border-radius:999px;
    padding:13px;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
  }
  .btn-primary{ background:var(--framboesa); color:#fff; }
  .btn-primary:hover{ background:var(--framboesa-escura); }
  .btn-primary:disabled{ opacity:0.6; cursor:default; }
  .btn-ghost{
    background:transparent;
    color:var(--chocolate-suave);
    border:1.5px solid rgba(59,42,42,0.14);
    font-weight:700;
  }
  .btn-ghost:hover{ background:var(--creme); }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    color:var(--chocolate-suave);
    font-size:0.78rem;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(59,42,42,0.12);
  }

  .btn-google{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--branco);
    color:var(--chocolate);
    border:1.5px solid rgba(59,42,42,0.14);
    border-radius:999px;
    padding:13px;
    font-weight:700;
    font-size:0.92rem;
    font-family:'Plus Jakarta Sans', sans-serif;
    cursor:pointer;
  }
  .btn-google:hover{ background:var(--creme); }
  .btn-google svg{ width:18px; height:18px; }

  .msg{
    font-size:0.82rem;
    padding:10px 12px;
    border-radius:10px;
    margin-top:6px;
    display:none;
    text-align:left;
  }
  .msg.show{ display:block; }
  .msg.err{ background:#FDE8EE; color:var(--erro); }

  /* ---------- Painel admin ---------- */
  #adminScreen{ display:none; }
  .admin-topbar{
    background:var(--branco);
    border-bottom:1px solid rgba(59,42,42,0.08);
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .admin-topbar h1{ font-size:1.15rem; flex:1; }
  .admin-main{
    max-width:720px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .admin-intro{
    font-size:0.88rem;
    color:var(--chocolate-suave);
    margin-bottom:22px;
    line-height:1.5;
  }

  .product-card{
    background:var(--branco);
    border-radius:18px;
    padding:18px 20px;
    box-shadow:var(--sombra);
    margin-bottom:16px;
  }
  .product-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .product-name{ font-weight:700; font-size:1rem; }
  .product-stock-badge{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.3rem;
    padding:4px 14px;
    border-radius:999px;
    background:var(--pistache-clara);
    color:#2F6B4F;
    white-space:nowrap;
  }
  .product-stock-badge.zero{
    background:#FDE8EE;
    color:var(--erro);
  }
  .product-stock-badge.sem-controle{
    background:var(--creme);
    color:var(--chocolate-suave);
    font-size:0.85rem;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:700;
  }

  .qty-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .qty-btn{
    border:1.5px solid rgba(59,42,42,0.14);
    background:var(--creme-2);
    color:var(--chocolate);
    font-weight:700;
    font-size:0.85rem;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .qty-btn:hover{ background:var(--creme); }
  .qty-btn.negativo{ color:var(--erro); }
  .qty-btn.positivo{ color:#2F6B4F; }

  .set-row{
    display:flex;
    gap:8px;
  }
  .set-row input{
    flex:1;
  }
  .set-row button{
    white-space:nowrap;
    border:none;
    background:var(--chocolate);
    color:#fff;
    font-weight:700;
    font-size:0.85rem;
    padding:0 18px;
    border-radius:999px;
    cursor:pointer;
  }
  .set-row button:hover{ background:#2a1e1e; }

  .product-hint{
    font-size:0.75rem;
    color:var(--chocolate-suave);
    margin-top:8px;
  }

  .empty-admin{
    text-align:center;
    color:var(--chocolate-suave);
    font-size:0.85rem;
    padding:40px 20px;
  }
</style>
</head>
<body>

<!-- ---------- Tela de login ---------- -->
<div id="loginScreen">
  <div class="login-card">
    <h1 class="brandname">artcake_<span class="script">cruz</span></h1>
    <p>Painel de controle de estoque</p>

    <div id="loginMsg" class="msg"></div>

    <form id="loginForm">
      <div>
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" placeholder="seu@email.com" required>
      </div>
      <div>
        <label for="loginPassword">Senha</label>
        <input id="loginPassword" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginSubmit">Entrar</button>
    </form>

    <div class="divider">ou</div>

    <button class="btn btn-google" id="googleBtn" type="button">
      <svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.05l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continuar com Google
    </button>
  </div>
</div>

<!-- ---------- Painel admin ---------- -->
<div id="adminScreen">
  <div class="admin-topbar">
    <h1 class="brandname">artcake_<span class="script">cruz</span> · Estoque</h1>
    <button class="btn btn-ghost" id="logoutBtn" style="width:auto; padding:8px 16px; margin:0;">Sair</button>
  </div>

  <div class="admin-main">
    <p class="admin-intro">
      Ajuste a quantidade disponível de cada sabor. As mudanças aparecem no site
      em tempo real — assim que o estoque de um item chega a 0, ele fica marcado
      como "Esgotado" automaticamente para os clientes.
    </p>

    <div id="productList"></div>
  </div>
</div>

<script type="module">
  import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, getDoc, setDoc, onSnapshot, increment }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db } from "./firebase-config.js";

  const googleProvider = new GoogleAuthProvider();

  // ======================================================================
  // Lista de produtos administráveis por aqui.
  // IMPORTANTE: os nomes precisam ser EXATAMENTE iguais aos nomes usados
  // no index.html (o texto dentro de <span class="card-title">...</span>),
  // porque é esse nome que liga o produto ao registro de estoque no
  // Firestore. Se adicionar um produto novo no site, adicione o nome dele
  // aqui também.
  // ======================================================================
  const PRODUCTS = [
    'Brigadeiro',
    'Ninho com morango',
    'Red Velvet com Ninho',
    'Beijinho com chocolate',
    'Maracujá'
  ];

  const loginScreen = document.getElementById('loginScreen');
  const adminScreen = document.getElementById('adminScreen');
  const loginForm = document.getElementById('loginForm');
  const loginSubmit = document.getElementById('loginSubmit');
  const loginMsg = document.getElementById('loginMsg');
  const logoutBtn = document.getElementById('logoutBtn');
  const productList = document.getElementById('productList');
  const googleBtn = document.getElementById('googleBtn');

  function showMsg(el, text){
    el.textContent = text;
    el.className = 'msg show err';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginMsg.className = 'msg';
    loginSubmit.disabled = true;
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    try{
      await signInWithEmailAndPassword(auth, email, password);
    } catch(err){
      showMsg(loginMsg, 'E-mail ou senha incorretos.');
    } finally {
      loginSubmit.disabled = false;
    }
  });

  googleBtn.addEventListener('click', async () => {
    loginMsg.className = 'msg';
    try{
      await signInWithPopup(auth, googleProvider);
    } catch(err){
      showMsg(loginMsg, 'Não foi possível entrar com o Google. Tente novamente.');
    }
  });

  logoutBtn.addEventListener('click', () => signOut(auth));

  // ---------- Monta um card de produto ----------
  function criarCardProduto(name){
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-head">
        <span class="product-name">${name}</span>
        <span class="product-stock-badge sem-controle" data-badge>Sem controle</span>
      </div>
      <div class="qty-buttons">
        <button type="button" class="qty-btn negativo" data-delta="-5">-5</button>
        <button type="button" class="qty-btn negativo" data-delta="-1">-1</button>
        <button type="button" class="qty-btn positivo" data-delta="1">+1</button>
        <button type="button" class="qty-btn positivo" data-delta="5">+5</button>
        <button type="button" class="qty-btn positivo" data-delta="10">+10</button>
      </div>
      <div class="set-row">
        <input type="number" min="0" placeholder="Definir quantidade exata" data-input>
        <button type="button" data-definir>Definir</button>
      </div>
      <p class="product-hint">
        Os botões +/- somam ou tiram dessa quantidade. "Definir" substitui pelo
        número exato que você digitar (útil pra começar o controle de um produto
        ou zerar o estoque no início do dia).
      </p>
    `;

    const badge = card.querySelector('[data-badge]');
    const input = card.querySelector('[data-input]');

    async function ajustar(delta){
      try{
        await setDoc(doc(db, 'productStock', name), {
          remaining: increment(delta)
        }, { merge: true });
      } catch(err){
        alert('Não foi possível atualizar o estoque: ' + err.message);
      }
    }

    async function definir(valor){
      try{
        await setDoc(doc(db, 'productStock', name), {
          remaining: valor
        }, { merge: true });
      } catch(err){
        alert('Não foi possível definir o estoque: ' + err.message);
      }
    }

    card.querySelectorAll('[data-delta]').forEach(btn => {
      btn.addEventListener('click', () => ajustar(parseInt(btn.dataset.delta, 10)));
    });

    card.querySelector('[data-definir]').addEventListener('click', () => {
      const valor = parseInt(input.value, 10);
      if(isNaN(valor) || valor < 0){
        alert('Digite uma quantidade válida (0 ou mais).');
        return;
      }
      definir(valor);
      input.value = '';
    });

    // Escuta em tempo real
    onSnapshot(doc(db, 'productStock', name), (snap) => {
      if(snap.exists() && typeof snap.data().remaining === 'number'){
        const remaining = snap.data().remaining;
        badge.textContent = remaining <= 0 ? 'Esgotado' : `${remaining} un.`;
        badge.classList.remove('sem-controle');
        badge.classList.toggle('zero', remaining <= 0);
      } else {
        badge.textContent = 'Sem controle';
        badge.className = 'product-stock-badge sem-controle';
      }
    });

    return card;
  }

  function montarPainel(){
    productList.innerHTML = '';
    if(PRODUCTS.length === 0){
      productList.innerHTML = '<p class="empty-admin">Nenhum produto cadastrado na lista PRODUCTS do admin.html.</p>';
      return;
    }
    PRODUCTS.forEach(name => {
      productList.appendChild(criarCardProduto(name));
    });
  }

  // ---------- Controle de acesso ----------
  // Só entra quem tiver login E um documento correspondente na coleção
  // "admins" do Firestore (id do documento = UID do usuário).
  onAuthStateChanged(auth, async (user) => {
    if(!user){
      loginScreen.style.display = 'flex';
      adminScreen.style.display = 'none';
      return;
    }

    try{
      const snap = await getDoc(doc(db, 'admins', user.uid));
      if(snap.exists()){
        loginScreen.style.display = 'none';
        adminScreen.style.display = 'block';
        montarPainel();
      } else {
        showMsg(loginMsg, `Essa conta não tem permissão de administrador. (e-mail: ${user.email || '—'} | UID: ${user.uid})`);
        await signOut(auth);
      }
    } catch(err){
      showMsg(loginMsg, `Erro ao verificar permissão: ${err.message}`);
      await signOut(auth);
    }
  });
</script>

</body>
</html>
